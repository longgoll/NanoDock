[workspace]
resolver = "2"
members = [
    "crates/shared-types",
    "crates/wsl-bridge",
    "crates/guest-agent",
    "crates/core-daemon",
    "crates/nanodock-cli",
]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
