name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: Determine Release Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version & existing tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; skipping duplicate release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${TAG} detected on main; starting release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-rootfs:
    name: Build Alpine WSL2 RootFS
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build micro-distro.tar.gz
        run: |
          mkdir -p rootfs-builder/out
          docker build -f rootfs-builder/Dockerfile.rootfs -t nanodock-rootfs:build .
          CONTAINER_ID=$(docker create nanodock-rootfs:build)
          docker export "$CONTAINER_ID" | gzip -9 > rootfs-builder/out/micro-distro.tar.gz
          docker rm "$CONTAINER_ID"

      - name: Upload RootFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: micro-distro-rootfs
          path: rootfs-builder/out/micro-distro.tar.gz

  build-windows:
    name: Build Windows Bundle & Installer
    needs: [prepare-release, build-rootfs]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download RootFS artifact
        uses: actions/download-artifact@v4
        with:
          name: micro-distro-rootfs
          path: rootfs-builder/out

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable bundle
        shell: pwsh
        run: .\bundle.ps1

      - name: Build NSIS installer & updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --bundles nsis --config src-tauri/tauri.bundle.conf.json

      - name: Generate latest.json for Tauri updater
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) {
            throw "Missing NSIS installer or .sig file in $nsisDir"
          }
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $tag = "${{ needs.prepare-release.outputs.tag }}"
          $manifest = @{
            version = $version
            notes = "NanoDock v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exe.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "$nsisDir/latest.json" -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: NanoDock ${{ needs.prepare-release.outputs.tag }}
          files: |
            NanoDock-portable-windows-x64.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
