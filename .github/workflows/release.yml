name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-rootfs:
    name: Build Alpine WSL2 RootFS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build micro-distro.tar.gz
        run: |
          mkdir -p rootfs-builder/out
          docker build -f rootfs-builder/Dockerfile.rootfs -t nanodock-rootfs:build .
          CONTAINER_ID=$(docker create nanodock-rootfs:build)
          docker export "$CONTAINER_ID" | gzip -9 > rootfs-builder/out/micro-distro.tar.gz
          docker rm "$CONTAINER_ID"

      - name: Upload RootFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: micro-distro-rootfs
          path: rootfs-builder/out/micro-distro.tar.gz

  build-windows:
    name: Build Windows Bundle & Installer
    needs: build-rootfs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download RootFS artifact
        uses: actions/download-artifact@v4
        with:
          name: micro-distro-rootfs
          path: rootfs-builder/out

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build portable bundle
        shell: pwsh
        run: .\bundle.ps1

      - name: Build NSIS installer & updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --bundles nsis --config src-tauri/tauri.bundle.conf.json

      - name: Generate latest.json for Tauri updater
        shell: pwsh
        run: |
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          $sig = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) {
            throw "Missing NSIS installer or .sig file in $nsisDir"
          }
          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $manifest = @{
            version = $version
            notes = "NanoDock v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content $sig.FullName -Raw).Trim()
                url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($exe.Name)"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "$nsisDir/latest.json" -Encoding UTF8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NanoDock-portable-windows-x64.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
